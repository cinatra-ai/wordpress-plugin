name: docs-meta-commentary

# Runs the reusable meta-commentary gate (cinatra-ai/ci) against this repo's
# published Markdown surfaces — the docs/ tree, the top-level README.md, and the
# WordPress.org listing copy in .wordpress-org/README.md: fails a PR when a
# published, user-facing page carries meta/implementation commentary about how
# the docs or the listing assets THEMSELVES are produced — generation mechanics,
# "forthcoming"/placeholder transition notes, editorial TODOs, and the like.
# Wires cinatra-ai/docs#119 into this repo, widened to the multi-path scan set
# from cinatra-ai/docs#156 (README.md is published surface too).
#
# .wordpress-org/ is staged listing copy for wordpress.org/plugins/cinatra/, so
# it is gated as a published surface rather than exempted as maintainer-only
# (cinatra-ai/docs#156 AC5): asset-production notes there are removed, not
# allowlisted.
#
# Structured like the sibling docs-contract-gate.yml caller: both the workflow
# ref (`@<sha>`) and the `ref` input are pinned to the SAME cinatra-ai/ci commit
# SHA, so the gate engine is not pulled from mutable main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-commentary-gate:
    uses: cinatra-ai/ci/.github/workflows/meta-commentary-gate.yml@7e5f4163937b69899130cc0c6e9bcbb949486070 # v0.1.3-next.7e5f416
    with:
      paths: |
        docs
        README.md
        .wordpress-org/README.md
      ref: 7e5f4163937b69899130cc0c6e9bcbb949486070
